services:
  oi:
    image: ghcr.io/akankofik-dev/oi:1.0.2b9
    container_name: oi
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    pull_policy: missing
    ports:
      - "8088:8088"
    # 官方镜像 entrypoint 读不到飞牛向导密码（.env 不在 @appcenter）。
    # 改用 data-share 上的引导脚本：每次启动用向导密码 init 或 passwd。
    entrypoint: ["bash", "/usr/local/bin/fnos-boot.sh"]
    volumes:
      - "${TRIM_DATA_SHARE_PATHS}/.oi:/data/.oi"
      - "${TRIM_DATA_SHARE_PATHS}/fnos-boot.sh:/usr/local/bin/fnos-boot.sh:ro"
      - "${TRIM_DATA_SHARE_PATHS}/fnos-admin.env:/data/fnos-admin.env:ro"
    environment:
      - HOME=/data
      - OI_HOME=/data/.oi
      - OI_BIND_HOST=0.0.0.0
      - OI_PORT=${OI_PORT:-8088}
      - OI_LOG_LEVEL=${OI_LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3)); raise SystemExit(0 if r.get('users_loaded', 0) >= 1 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
