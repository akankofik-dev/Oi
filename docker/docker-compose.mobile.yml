# =============================================================================
# Oi — Remote Phone (mobile) compose overlay for local / DinD testing
#
# Usage (from repo root):
#   # once: download platform-tools next to the repo
#   mkdir -p .tools && cd /tmp && curl -fsSL -o pt.zip \
#     https://dl.google.com/android/repository/platform-tools-latest-linux.zip \
#     && unzip -qo pt.zip -d /workspace/Oi/.tools
#
#   docker compose -f docker/docker-compose.mobile.yml up -d --build
#
# This file is standalone (not an overlay) because ``network_mode: host``
# conflicts with published ``ports`` from the base compose file.
#
# Host prerequisites:
# - Docker socket usable by the container
# - /dev/binder or /dev/binderfs on the host
# - Enough free disk for the Redroid image
# =============================================================================

services:
  oi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: oi:latest
    container_name: oi
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    privileged: true
    network_mode: host
    volumes:
      - ${OI_DATA:-~/.oi}:/data/.oi
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/binderfs:/dev/binderfs
      - ${OI_PLATFORM_TOOLS:-../.tools/platform-tools}:/opt/android-sdk/platform-tools:ro
    environment:
      - HOME=/data
      - OI_BIND_HOST=0.0.0.0
      - OI_PORT=${OI_PORT:-8088}
      - OI_LOG_LEVEL=${OI_LOG_LEVEL:-info}
      - OI_DEFAULT_PASSWORD=${OI_DEFAULT_PASSWORD:-}
      - OI_ADMIN_USERNAME=${OI_ADMIN_USERNAME:-admin}
      - OI_MOBILE_ADB_HOST=${OI_MOBILE_ADB_HOST:-127.0.0.1:5555}
      - OI_MOBILE_CONTAINER=${OI_MOBILE_CONTAINER:-oi-mobile-android}
      - OI_ENABLE_MOBILE=${OI_ENABLE_MOBILE:-1}
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
