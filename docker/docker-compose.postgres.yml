# =============================================================================
# Local PostgreSQL (+ pgvector) for Oi dual-backend development / tests
#
# From repo root:
#   docker compose -f docker/docker-compose.postgres.yml up -d
#   docker compose -f docker/docker-compose.postgres.yml down
#
# Connection (default):
#   postgresql://oi:oi@127.0.0.1:5432/oi
#
# For pytest / Oi:
#   export OI_TEST_DATABASE_URL='postgresql://oi:oi@127.0.0.1:5432/oi'
#   export OI_DATABASE_URL='postgresql://oi:oi@127.0.0.1:5432/oi'
#
# Init layers (ADR 002):
#   - Control-plane schema → Oi migrate (NNN_*.pg.sql), not this compose
#   - CREATE EXTENSION vector → postgres/init-vector.sql (initdb.d only)
#   - Agent memory tables → oi-memory at runtime
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: oi-postgres
    restart: unless-stopped
    ports:
      - "${OI_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${OI_PG_USER:-oi}
      POSTGRES_PASSWORD: ${OI_PG_PASSWORD:-oi}
      POSTGRES_DB: ${OI_PG_DB:-oi}
    volumes:
      - oi_pgdata:/var/lib/postgresql/data
      - ./postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oi_pgdata:
