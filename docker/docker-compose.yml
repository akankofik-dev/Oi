# =============================================================================
# Oi — Docker Compose
#
# 用法（在仓库根目录执行）:
#   docker compose -f docker/docker-compose.yml up -d
#   OI_PORT=9090 docker compose -f docker/docker-compose.yml up -d
#   OI_DEFAULT_PASSWORD=<your-strong-password> docker compose -f docker/docker-compose.yml up -d
#
# 可在 docker/ 目录放置 .env 文件，例如:
#   OI_PORT=9090
#   OI_DEFAULT_PASSWORD=<your-strong-password>
#   OI_ADMIN_USERNAME=admin
#   OI_DATABASE_DRIVER=postgresql
#   OI_DATABASE_URL=postgresql://oi:oi@host.docker.internal:5432/oi
#
# 注意: docker/.env 仅用于 Compose 插值；变量必须列在下方 environment
# 才会进入容器。也可写入数据卷内的 ~/.oi/env（宿主机挂载目录下的 env）。
# 密码须 ≥8 位且同时包含字母与数字（与控制台改密策略一致）。
# 未设置或未通过策略时不自动建管理员，打开页面走设置向导
# （向导口令写入 /data/.oi/oi-login.txt）。
# =============================================================================

services:
  oi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: oi:latest
    container_name: oi
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${OI_PORT:-8088}:${OI_PORT:-8088}"
    volumes:
      - ${OI_DATA:-~/.oi}:/data/.oi
    environment:
      - HOME=/data
      - OI_BIND_HOST=0.0.0.0
      - OI_PORT=${OI_PORT:-8088}
      - OI_LOG_LEVEL=${OI_LOG_LEVEL:-info}
      - OI_DEFAULT_PASSWORD=${OI_DEFAULT_PASSWORD:-}
      - OI_ADMIN_USERNAME=${OI_ADMIN_USERNAME:-admin}
      - OI_ADMIN_DISPLAY_NAME=${OI_ADMIN_DISPLAY_NAME:-Admin}
      - OI_DATABASE_URL=${OI_DATABASE_URL:-}
      - OI_DATABASE_DRIVER=${OI_DATABASE_DRIVER:-}
      - OI_DATABASE_SQLITE_PATH=${OI_DATABASE_SQLITE_PATH:-}
      - OI_DATABASE_HOST=${OI_DATABASE_HOST:-}
      - OI_DATABASE_PORT=${OI_DATABASE_PORT:-}
      - OI_DATABASE_NAME=${OI_DATABASE_NAME:-}
      - OI_DATABASE_USER=${OI_DATABASE_USER:-}
      - OI_DATABASE_PASSWORD=${OI_DATABASE_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
